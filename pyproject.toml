[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-ttrl"
version = "0.1.0"
description = "Evidence-Gated Counterfactual Test-Time RL for stateful tool agents (research scaffold, M0)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "jsonschema>=4.22",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.40",
    "peft>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "matplotlib>=3.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_ttrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
